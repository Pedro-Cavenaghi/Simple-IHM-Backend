name: Backend Pipeline

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check syntax
        run: python -m compileall app simulador ml

      - name: Ruff lint
        run: python -m ruff check app simulador ml

      - name: Ruff format
        run: python -m ruff format --check app simulador ml


  compatibility:
    name: Compatibility - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Check syntax
        run: python -m compileall app

      - name: Import FastAPI application
        run: python -c "from app.main import app; print(app.title)"

  automated-tests:
    name: Automated Tests - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            ml/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install -r ml/requirements.txt

      
      - name: Run automated tests
        run: |
          python -m pytest tests/unit tests/api -v \
            --cov \
            --cov-report=

      - name: Rename coverage data
        if: always()
        run: |
          if [ -f .coverage ]; then
            mv .coverage .coverage.python-${{ matrix.python-version }}
          fi

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-data-python-${{ matrix.python-version }}
          path: .coverage.python-${{ matrix.python-version }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7


  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18

        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: simple_ihm_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U test_user -d simple_ihm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_DB_USER: test_user
      TEST_DB_PASSWORD: test_password
      TEST_DB_NAME: simple_ihm_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Apply database schema
        env:
          PGPASSWORD: test_password
        run: |
          docker run --rm \
            --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            postgres:18 \
            psql \
              -h localhost \
              -p 5432 \
              -U test_user \
              -d simple_ihm_test \
              -v ON_ERROR_STOP=1 \
              -f database/schema.sql
      
      - name: Run integration tests
        run: |
          python -m pytest tests/integration -v \
            --cov \
            --cov-report=

      - name: Rename coverage data
        if: always()
        run: |
          if [ -f .coverage ]; then
            mv .coverage .coverage.integration
          fi

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-data-integration
          path: .coverage.integration
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  coverage-aggregation:
    name: Total Coverage Report
    runs-on: ubuntu-latest

    needs:
      - automated-tests
      - integration-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install coverage
        run: |
          python -m pip install --upgrade pip
          python -m pip install coverage

      - name: Download coverage artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine coverage data
        run: |
          coverage combine
          coverage report --show-missing

      - name: Generate coverage reports
        run: |
          coverage html
          coverage xml

      - name: Publish coverage summary
        run: |
          echo "# Total Test Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Overall coverage:** $(coverage report --format=total)%" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          coverage report --show-missing >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload total coverage report
        uses: actions/upload-artifact@v6
        with:
          name: total-coverage-report
          path: |
            htmlcov/
            coverage.xml
          retention-days: 14


  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest

    if: always()

    needs:
      - quality
      - compatibility
      - automated-tests
      - integration-tests
      - coverage-aggregation

    steps:
      - name: Publish pipeline summary
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          AUTOMATED_TESTS_RESULT: ${{ needs.automated-tests.result }}
          INTEGRATION_TESTS_RESULT: ${{ needs.integration-tests.result }}
          COVERAGE_RESULT: ${{ needs.coverage-aggregation.result }}
        run: |
          results=(
            "$QUALITY_RESULT"
            "$COMPATIBILITY_RESULT"
            "$AUTOMATED_TESTS_RESULT"
            "$INTEGRATION_TESTS_RESULT"
            "$COVERAGE_RESULT"
          )

          overall="SUCCESS"
          for result in "${results[@]}"; do
            if [ "$result" != "success" ]; then
              overall="NOT SUCCESS"
              break
            fi
          done

          echo "# Pipeline Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$overall" = "SUCCESS" ]; then
            echo "## ✅ Pipeline completed successfully" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ❌ Pipeline completed with problems" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Code Quality | $QUALITY_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Compatibility (Ubuntu + Windows) | $COMPATIBILITY_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Automated Tests (Python 3.12 + 3.13) | $AUTOMATED_TESTS_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Integration Tests | $INTEGRATION_TESTS_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Total Coverage Report | $COVERAGE_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Overall result:** $overall" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "See the **Total Coverage Report** job summary for the detailed coverage percentage and module report. The HTML and XML reports are available in the \`total-coverage-report\` artifact."
