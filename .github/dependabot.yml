version: 2

updates:
  # Dependências Python
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      python-dependencies:
        patterns:
          - "*"

  # Actions utilizadas na pipeline
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      actions-dependencies:
        patterns:
          - "*"