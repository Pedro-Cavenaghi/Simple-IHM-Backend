services:
  db:
    image: postgres:15-alpine
    container_name: simple-ihm-postgres
    restart: always
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: monitoramento_industrial
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./dump-monitoramento_industrial-202610152208.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d monitoramento_industrial"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: simple-ihm-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://test_user:test_password@db:5432/monitoramento_industrial
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: